      channel_ownership_help: "Com os membros no comando, a grade de permissões abaixo se divide em dois blocos. \"Chat: global\" vale para todo o chat, em todos os canais. \"Chat: canais dos membros\" vale só dentro dos canais que os membros criam e administram: criar, gerenciar, editar, e o que os membros podem enviar neles. O dono de um canal pode promover membros a moderadores daquele canal; donos e moderadores do canal não passam pelo modo lento. Administradores e moderadores do chat continuam com todos os canais."
      allow_archiving_channels_help: Um canal fechado pode ser arquivado em uma discussão que guarda a transcrição.
      threading_default_help: Canais novos já nascem com tópicos ligados. Cada canal ainda pode mudar isso.
      retention_warning: A retenção exclui mensagens permanentemente. Não há como desfazer.
      channel_retention_days: Retenção em canais (dias)
