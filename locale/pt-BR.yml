      show_icon_help: Desligue para mostrar apenas o nome.

      threading_default: Habilitar tópicos por padrão em novos canais
      allow_archiving_channels: Permitir arquivar canais
      queue_realtime: Entregar eventos em tempo real pela fila
      queue_realtime_help: "Desligado por padrão: os envios acontecem na própria requisição, então as mensagens chegam na hora. Ligue apenas se o fórum mantém um worker de fila rodando continuamente, ou se o servidor web não alcança o daemon do websocket. Com o driver de fila 'database' do Flarum o worker roda uma vez por minuto, o que atrasa cada mensagem em até esse tempo."
