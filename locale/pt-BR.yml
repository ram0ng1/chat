      max_message_length: Tamanho máximo da mensagem
      max_message_length_help: O limite do fórum inteiro. Um canal pode definir um limite menor só para ele.
      message_edit_window_minutes: Janela de edição (minutos)
      message_edit_window_help: Por quanto tempo o autor pode editar a mensagem. 0 significa sem limite.

      allow_uploads: Permitir envio de arquivos no chat
      allow_uploads_help: Anexos nas mensagens. Quais grupos podem anexar é uma permissão logo abaixo.
      max_upload_size: Tamanho máximo de envio (bytes)
