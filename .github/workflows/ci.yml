name: CI

# Mesmo formato dos demais repositórios ramon/*. Os jobs abaixo são só os que esta
# extensão tem como executar: um passo que roda contra algo inexistente não é
# cobertura, é um X vermelho que ensina a ignorar X vermelhos.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC. Como as dependências são resolvidas com `composer update`,
  # o agendamento testa contra o flarum/core mais recente e detecta quebras
  # trazidas por novas versões antes que cheguem a você.
  schedule:
    - cron: '0 5 * * 1'

# Evita empilhar execuções redundantes para o mesmo PR ou branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny do GITHUB_TOKEN; cada job declara o que precisa.
permissions: {}

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Piso do flarum/core 2.x até a versão estável mais recente.
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      - name: Instalar dependências PHP
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Testes unitários (PHPUnit)
        run: vendor/bin/phpunit --testsuite unit

      # A suíte de integração existia sem nunca rodar em lugar nenhum, e por isso
      # os 10 testes estavam quebrados — fixtures sem `password`, conteúdo gravado
      # como texto cru em vez de XML do s9e. Sem este passo, ela volta a apodrecer.
      # SetupScript lê a configuração de variáveis de ambiente e usa SQLite por
      # padrão, então não há nada a provisionar.
      - name: Preparar banco de testes
        run: php tests/integration/setup.php

      - name: Testes de integração (PHPUnit)
        run: vendor/bin/phpunit --testsuite integration

  js:
    name: JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP (typings do core)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      - name: Build (webpack production)
        working-directory: js
        run: npm run build

  phpstan:
    name: PHPStan (nível 6, baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: PHPStan analyse
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
